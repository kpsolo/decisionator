name: CI

on:
  push:
    branches: [main, "001-*", "00*"]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Test & Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Contract tests
        run: pnpm test:contract

      - name: Install Playwright browsers
        run: pnpm --filter @decisionator/web exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e -- --project=chromium

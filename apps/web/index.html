<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deci</title>
    <script>
      // Resolve the theme before first paint so dark-mode users never see a light flash.
      // Mirrors ThemeProvider (src/components/theme-provider.tsx).
      (function () {
        var theme = "system";
        try {
          var stored = localStorage.getItem("decisionator-theme");
          if (stored === "light" || stored === "dark" || stored === "system") theme = stored;
        } catch (e) {}
        var resolved =
          theme === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme;
        var root = document.documentElement;
        root.classList.add(resolved);
        root.setAttribute("data-theme", resolved);
        root.style.colorScheme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
